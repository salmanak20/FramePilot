name: Desktop app builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-intel
          - os: macos-15
            target: macos-apple-silicon
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: Install app and packaging dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-desktop.txt ${{ runner.os == 'Linux' && 'PyGObject' || '' }}
      - name: Build the desktop app
        run: pyinstaller --clean --noconfirm FramePilot.spec
      - name: Package Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FramePilot -DestinationPath FramePilot-${{ matrix.target }}.zip
      - name: Package macOS download
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FramePilot.app FramePilot-${{ matrix.target }}.zip
      - name: Package Linux download
        if: runner.os == 'Linux'
        run: tar -czf FramePilot-${{ matrix.target }}.tar.gz -C dist FramePilot
      - uses: actions/upload-artifact@v4
        with:
          name: FramePilot-${{ matrix.target }}
          path: FramePilot-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: FramePilot-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: FramePilot ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
